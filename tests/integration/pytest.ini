[pytest]
# These run inside a real Home Assistant, through pytest-homeassistant-custom-component,
# unlike the tests one level up, which build entities around stand-ins and turn that plugin
# off. Run them separately: `python -m pytest tests/integration`. This file makes this
# directory the root of that run, so the plugin and its settings apply here only.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Respx's plugin imports httpx, which from 2026.11 Home Assistant refuses: it aliases httpx
# to httpx2 on import and must do so first. The tests use none of respx.
addopts = -p no:respx -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    # A task or thread that crashes unseen is a bug, not noise: a test once passed only
    # because the task it was checking died of a RecursionError.
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestUnhandledThreadExceptionWarning
