name: Release

# A push to main is not released by itself. A release happens one of two ways, each of which
# settles the version, rotates CHANGELOG.md's Unreleased section into a version heading, and
# publishes a GitHub release whose notes are that section plus the commits since the last
# release:
#
# - A commit sets a new version in manifest.json. A version with no git tag yet was set by
#   hand, and it is released exactly as written once BOTH the Test and Validate workflows
#   have completed successfully for the commit. A push that leaves the version alone stops
#   at once.
# - Someone runs this workflow from the Actions tab. `auto` releases a hand-set version as
#   written, otherwise the minor version after the newest tag, and stops if main is already
#   released. `minor` and `major` always bump, and `none` publishes the manifest version as
#   it stands. Test and Validate must have succeeded for main here too, unless
#   `ignore_checks` is ticked, for when one of them needs a nudge.
#
# Tags and release names are the bare version — `1.0`, never `v1.0`. A leading `v` set in
# the manifest by hand is removed and the manifest committed without it.
#
# Only Test starts it. This repo runs Test (pytest + ruff) and Validate (HACS + hassfest) as
# separate workflows, and until 2026-10-16 both started this one, so every push ran it twice
# (the first run, from Validate, found Test still going and stopped) and every nightly
# Validate added a skipped run. Validate takes under a minute and Test about three, so this
# waits for Test and then checks via the API that Validate has succeeded for the same
# commit, waiting out the rare push where it hasn't finished. Validate re-run after failing
# no longer releases by itself: re-run Test once it passes.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version (auto = the manifest's if it is new, otherwise the next minor; none = publish the manifest's as it stands)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - minor
          - major
          - none
      ignore_checks:
        description: "Release even if Test or Validate has not succeeded for this commit"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - Test
    # Test also runs for pull requests and other branches; without this, each of those
    # would show a skipped Release run too.
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

# Queued, never cancelled: a run cancelled between pushing its release commit and publishing
# the release would leave one without the other. The run that waits finds the commit already
# released and stops.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump manifest and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      # Every green push on main comes through here, and only one that set a new version goes
      # any further. Checked first, so the others don't wait on Validate for nothing.
      - name: Look for a version set by hand
        id: hand_set
        if: github.event_name == 'workflow_run'
        run: |
          hand_set="$(python3 .github/scripts/bump_manifest_version.py --hand-set)"
          echo "hand_set=$hand_set" >> "$GITHUB_OUTPUT"

      # Only a commit that passed both is released. They almost always finished minutes ago;
      # when they haven't, wait for them rather than give up on the release.
      - name: Check Test and Validate succeeded for this commit
        id: checks
        if: >-
          steps.hand_set.outputs.hand_set == 'true' ||
          (github.event_name == 'workflow_dispatch' && !inputs.ignore_checks)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="$HEAD_SHA"
          if [ -z "$sha" ]; then
            sha="$(git rev-parse origin/main)"
            # A release commit carries [skip ci], so the commit before it is the one checked.
            if [[ "$(git log -1 --format=%s "$sha")" == chore\(release\):*\ \[skip\ ci\] ]]; then
              sha="$(git rev-parse "$sha^")"
            fi
          fi
          green=true
          for workflow in test.yml validate.yml; do
            # Every 20 seconds for up to 15 minutes.
            for _ in $(seq 45); do
              read -r status conclusion < <(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${sha}&per_page=1" \
                  --jq '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "none")"'
              )
              if [ "$status" = "completed" ]; then
                break
              fi
              echo "$workflow is $status for $sha; checking again in 20 seconds."
              sleep 20
            done
            echo "$workflow is $status, $conclusion, for $sha."
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              green=false
              break
            fi
          done
          echo "green=$green" >> "$GITHUB_OUTPUT"

      - name: Decide what to release
        id: head_check
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BUMP_INPUT: ${{ inputs.bump }}
          IGNORE_CHECKS: ${{ inputs.ignore_checks }}
          HAND_SET: ${{ steps.hand_set.outputs.hand_set }}
          CHECKS_GREEN: ${{ steps.checks.outputs.green }}
        run: |
          current_sha="$(git rev-parse origin/main)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$CHECKS_GREEN" != "true" ] && [ "$IGNORE_CHECKS" != "true" ]; then
              echo "::error::Test and Validate have not both succeeded for main, so it is not released. Fix them, or run this again with ignore_checks."
              exit 1
            fi
            # Nothing has landed since the last release, so a new version would be an empty one.
            if [ "$BUMP_INPUT" = "auto" ] && git tag --points-at "$current_sha" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
              echo "::notice::$current_sha is already released, so there is nothing new to release."
              echo "release_action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$BUMP_INPUT" = "none" ]; then
              echo "release_action=existing" >> "$GITHUB_OUTPUT"
            else
              echo "release_action=bump" >> "$GITHUB_OUTPUT"
            fi
            echo "release_target=$current_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAND_SET" != "true" ]; then
            echo "::notice::Not released: manifest.json holds no new version. Run the Release workflow to release what has landed."
            echo "release_action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CHECKS_GREEN" != "true" ]; then
            echo "Test and Validate have not both succeeded for $EXPECTED_SHA, so it is not released."
            echo "release_action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This commit, or the release commit an earlier run made for it and never published.
          previous_sha="$(git rev-parse "$current_sha^")"
          latest_subject="$(git log -1 --format=%s "$current_sha")"
          if [ "$current_sha" = "$EXPECTED_SHA" ] || {
            [ "$previous_sha" = "$EXPECTED_SHA" ] && [[ "$latest_subject" == chore\(release\):*\ \[skip\ ci\] ]]
          }; then
            echo "release_action=existing" >> "$GITHUB_OUTPUT"
            echo "release_target=$current_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Skipping stale run for $EXPECTED_SHA because main is already at $current_sha."
          echo "release_action=skip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.head_check.outputs.release_action != 'skip'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Settle version and rotate changelog
        if: steps.head_check.outputs.release_action != 'skip'
        id: bump
        env:
          RELEASE_ACTION: ${{ steps.head_check.outputs.release_action }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          # `existing` is the manifest version as it stands: a hand-set one, a manual `none`,
          # or the retry of a committed-but-unpublished release. Otherwise it is a manual
          # run's choice. See the header.
          if [ "$RELEASE_ACTION" = "existing" ]; then
            bump=none
          else
            bump="$BUMP_INPUT"
          fi
          new_version="$(python .github/scripts/bump_manifest_version.py --bump "$bump")"
          # A version not yet tagged is being released for the first time, so whatever is
          # under Unreleased belongs to it.
          if [ -z "$(git tag --list "$new_version")" ]; then
            python .github/scripts/update_changelog.py "$new_version"
          fi
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        if: steps.head_check.outputs.release_action != 'skip'
        id: commit_release
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kohler_konnect/manifest.json CHANGELOG.md
          # Nothing to commit when the version is kept as written and there was no
          # Unreleased section to rotate: release the pushed commit itself.
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): $NEW_VERSION [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release_target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release commit
        if: steps.commit_release.outputs.committed == 'true'
        run: git push origin HEAD:main

      # GitHub's auto-generated notes only list merged PRs, so direct-to-main releases came
      # out empty. Build the body ourselves: Highlights from CHANGELOG.md (rotated from its
      # Unreleased section during the bump) plus the commit list since the previous tag.
      - name: Generate release notes
        if: steps.head_check.outputs.release_action != 'skip'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: python .github/scripts/generate_release_notes.py "$NEW_VERSION" release_notes.md

      - name: Create GitHub release
        if: steps.head_check.outputs.release_action != 'skip'
        uses: actions/github-script@v9
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          RELEASE_TARGET: ${{ steps.commit_release.outputs.release_target || steps.head_check.outputs.release_target }}
        with:
          script: |
            const fs = require('fs')
            const tag = process.env.NEW_VERSION
            const target = process.env.RELEASE_TARGET
            // The version script already strips a leading `v`; this is the last line of
            // defence, because a published tag is effectively permanent.
            if (!/^\d+(\.\d+)+$/.test(tag)) {
              core.setFailed(`Refusing to release ${tag}: tags are bare versions like 1.0`)
              return
            }
            const body = fs.readFileSync('release_notes.md', 'utf8')
            const { owner, repo } = context.repo

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              })
              core.info(`Release ${tag} already exists; skipping creation.`)
              return
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: tag,
              body,
            })
