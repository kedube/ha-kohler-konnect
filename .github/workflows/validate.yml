name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      # The repository now uses the standard layout — the integration lives at
      # custom_components/kohler_konnect/ — so a plain checkout is what hassfest wants.
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
