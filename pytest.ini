[pytest]
testpaths = tests
# Home Assistant's test plugins (`pytest-homeassistant-custom-component`, and from 2026.11
# `pytest-home-assistant`) auto-load and expect their own harness; these tests construct
# entities directly and need none of it. Respx's plugin imports httpx, which from 2026.11
# Home Assistant refuses: it aliases httpx to httpx2 on import and must do so first.
addopts = -p no:homeassistant -p no:pytest_homeassistant -p no:respx -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    # A task or thread that crashes unseen is a bug, not noise: a test once passed only
    # because the task it was checking died of a RecursionError.
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestUnhandledThreadExceptionWarning
