[pytest]
testpaths = tests
# `pytest-homeassistant-custom-component` auto-loads and expects its own harness; these
# tests construct entities directly and need none of it.
addopts = -p no:homeassistant -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    # A task or thread that crashes unseen is a bug, not noise: a test once passed only
    # because the task it was checking died of a RecursionError.
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestUnhandledThreadExceptionWarning
